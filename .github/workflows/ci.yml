name: ci

# The checks `make check` runs locally, on every push and PR. Runs on Linux and
# macOS: boom targets both, and the compiled binary must boot on each.
on:
  push:
    branches: [main, v2/typescript]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile

      - name: Lint + format (biome)
        run: bunx biome check .

      - name: Typecheck (tsc)
        run: bunx tsc --noEmit

      - name: Test (bun test)
        run: bun test

      - name: Compile host binary
        run: bun build src/index.ts --compile --outfile build/boom

      - name: Smoke — binary boots
        run: ./build/boom --version

      # Smoke the config-free generators so a broken catalog/route fails CI, not a user.
      - name: Smoke — completions + man + skill
        run: |
          ./build/boom completions bash > /dev/null
          ./build/boom completions zsh > /dev/null
          ./build/boom completions fish > /dev/null
          ./build/boom man > /dev/null
          ./build/boom skill > /dev/null

      # Validate the shipped example against the live schema, so a schema change can't
      # silently invalidate the config every new user is pointed at while CI stays green.
      - name: Smoke — example boomfile validates
        run: BOOM_CONFIG=examples/dotfiles ./build/boom doctor --config

      # The docs generator runs only in pages.yml, which triggers on push to main — so a break
      # here used to merge green and fail AFTER landing, leaving the site serving a stale build.
      # It is ~1s and `marked` is already in the lockfile, so there is no reason not to gate it.
      - name: Smoke — docs site builds
        run: bun run site/build.ts

      # Reconcile for real, with the COMPILED binary. Every other engine test runs under plain
      # `bun`, but the engine loads user code through runtime `import()` of on-disk paths
      # (hooks, discovered commands) — the one thing `bun build --compile` changes and the one
      # thing the suite structurally cannot see. $HOME and the state dir are redirected into
      # $RUNNER_TEMP so this never touches the runner's real home.
      - name: Smoke — compiled binary reconciles a fixture
        shell: bash
        run: |
          set -euo pipefail
          fix="$RUNNER_TEMP/fixture"; home="$RUNNER_TEMP/fake-home"
          mkdir -p "$fix/hooks" "$home"
          printf 'z\n' > "$fix/.zshrc"
          cat > "$fix/boomfile.toml" <<'TOML'
          [[section]]
          name = "smoke"
          link = [{ src = ".zshrc", dst = "~/.zshrc" }]
          hook = [{ name = "probe" }]
          TOML
          cat > "$fix/hooks/probe.ts" <<'TS'
          export function sync(api) { api.ok("HOOK-RAN-OK"); }
          export function verify(api) { api.ok("HOOK-RAN-OK"); }
          TS
          run() { env HOME="$home" XDG_STATE_HOME="$RUNNER_TEMP/state" BOOM_CONFIG="$fix" "$PWD/build/boom" "$@"; }
          run source | tee "$RUNNER_TEMP/out.txt"
          grep -q 'HOOK-RAN-OK' "$RUNNER_TEMP/out.txt"   # the hook was import()ed inside the binary
          test -L "$home/.zshrc"                          # and the link actually landed
          run verify                                      # converged machine verifies clean (exit 0)

  version-guard:
    # Every PR must move package.json's version exactly one semver step from main —
    # patch (x.y.z+1), minor (x.y+1.0), or major (x+1.0.0) — or leave it unchanged.
    # Never skip (0.0.1→0.0.3) or jump (0.0.1→3.0.0): one merge, at most one release.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enforce a single-step version bump vs main
        run: |
          git fetch -q origin main
          base=$(git show origin/main:package.json | jq -r .version)
          head=$(jq -r .version package.json)
          echo "main: $base   this PR: $head"
          IFS=. read -r bM bm bp <<<"$base"
          IFS=. read -r hM hm hp <<<"$head"
          ok=0
          [ "$head" = "$base" ] && ok=1                                              # unchanged
          [ "$hM" = "$bM" ] && [ "$hm" = "$bm" ] && [ "$hp" = "$((bp+1))" ] && ok=1   # patch
          [ "$hM" = "$bM" ] && [ "$hm" = "$((bm+1))" ] && [ "$hp" = 0 ] && ok=1       # minor
          [ "$hM" = "$((bM+1))" ] && [ "$hm" = 0 ] && [ "$hp" = 0 ] && ok=1           # major
          if [ "$ok" != 1 ]; then
            echo "::error::version must be one step from main ($base): patch $bM.$bm.$((bp+1)), minor $bM.$((bm+1)).0, major $((bM+1)).0.0, or unchanged — got $head"
            exit 1
          fi
          echo "version OK: $base -> $head"

  cross-compile:
    # Bun cross-compiles every target from one host; prove the release matrix builds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Cross-compile release matrix
        run: |
          for t in bun-darwin-arm64 bun-darwin-x64 bun-linux-x64 bun-linux-arm64; do
            bun build src/index.ts --compile --target="$t" --outfile "build/boom-$t"
          done

  ci-gate:
    # The single required check. Branch protection points here and nowhere else:
    # requiring each job individually strands a required check in "pending" the
    # moment one is conditional — `version-guard` already is (PRs only), so on a
    # push it reports `skipped`, which is not a failure. Only a real `failure` or
    # `cancelled` fails the gate. Keep `needs` in sync when adding a job.
    if: always()
    needs: [check, version-guard, cross-compile]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
