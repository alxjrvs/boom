# An example boomfile.toml — a runnable reference for the resource types and phase order.
# Copy the pieces you need into your own dotfiles repo; `boom doctor --config` checks it.

# A top-level [boom] table folds boom's own self-wiring into the reconcile it already runs:
# keep the Claude skill fresh and nudge on a new release, instead of hand-rolling those as
# run steps.
[boom]
skill_on_sync = true             # regenerate ~/.claude/skills/boom/SKILL.md each sync
upgrade_on_sync = "check"        # warn when a newer boom release ships; upgrade it the way you installed it
# To run boom on a schedule, write the plist yourself and link it with the `launchd` resource
# (see the LaunchAgents section below).

[[section]]
name = "Shell + git"

[[section.link]]
src = ".zshrc"
dst = "~/.zshrc"

[[section.link]]
src = ".zprofile"
dst = "~/.zprofile"

[[section.link]]
src = ".zshenv"
dst = "~/.zshenv"

[[section.link]]
src = ".gitconfig"
dst = "~/.gitconfig"

[[section.link]]
src = ".gitignore"
dst = "~/.gitignore"

[[section.link]]
src = ".editorconfig"
dst = "~/.editorconfig"

[[section.link]]
src = "git-template/hooks/pre-commit"
dst = "~/.config/git/template/hooks/pre-commit"

[[section]]
name = "SSH"

[[section.link]]
src = "ssh/config"
dst = "~/.ssh/config"
mode = "600"

[[section.link]]
src = "ssh/1password-agent.toml"
dst = "~/.config/1Password/ssh/agent.toml"

[[section]]
name = "Per-machine git identity"

# `tmpl` renders the file before writing: ${env:VAR}/${host}/${os} (plus ${NAME} from the
# top-level [vars] table) are substituted, so one repo file yields per-machine content without
# a hook. `link` can't render — a symlink has no content of its own.
[[section.tmpl]]
src = "gitconfig-local.tmpl"
dst = "~/.config/git/local"

[[section]]
name = "Tools"

[[section.link]]
src = "mise.toml"
dst = "~/.config/mise/config.toml"

[[section.link]]
src = "starship.toml"
dst = "~/.config/starship.toml"

[[section.link]]
src = "ghostty/config"
dst = "~/.config/ghostty/config"

[[section.link]]
src = "nvim/init.lua"
dst = "~/.config/nvim/init.lua"

[[section]]
name = "Claude"

[[section.link]]
src = "dot-claude/CLAUDE.md"
dst = "~/.claude/CLAUDE.md"

[[section.link]]
src = "dot-claude/settings.json"
dst = "~/.claude/settings.json"

[[section]]
name = "Packages + zsh fragments"

# `pkg`: one array entry per manager — `brew`, `mise` or `gh`. `brew` runs `brew bundle` over
# `file` (default "Brewfile"), never upgrading; `mise` runs `mise install` against the repo's
# mise config. `cleanup` (brew only) is the inverse of a Brewfile: "check" makes every verb
# name installed-but-undeclared packages, "uninstall" lets sync remove them.
#
# `remove_on_uninstall` decides what `boom uninstall` reclaims, per entry. It is rejected on
# brew/mise, which have no "remove exactly what this file declares" verb — tear those down with
# a `run` step bound to `on = "uninstall"`. `gh` removes what it installed unless `= false`.
pkg = [
  { manager = "brew", file = "Brewfile", cleanup = "check" },
  { manager = "mise" },
]

# A glob `src` places every match under `dst` (a directory), preserving structure below the
# pattern's static prefix.
[[section.link]]
src = "zsh/[0-9]*.zsh"
dst = "~/.config/zsh/"

[[section]]
name = "gh extensions"

# `gh` extensions are a `pkg` manager like any other: one `owner/repo` per line in the file.
# Owner-qualified deliberately — four community forks answer to the name `gh-stack`, so the
# owner is what makes the declaration unambiguous. Because it shells out to `gh`, this section
# comes *after* the one whose Brewfile installs it: entries run in array order and sections in
# declaration order, and boom has no cross-section dependency mechanism. `boom verify` diffs
# `gh extension list` against this file (drift from a hand-removed extension is visible, which
# a fire-and-forget `run` step could never report) and `boom uninstall` removes them.
pkg = [{ manager = "gh", file = "gh-extensions.txt" }]

[[section]]
name = "SSH perms"

# `dir` ensures a standalone directory exists with a mode — a declarative `mkdir -p` + `chmod`.
# `remove_on_uninstall = true` would remove it on uninstall (only if empty); omitted here since
# ~/.ssh holds user data.
[[section.dir]]
path = "~/.ssh"
mode = "700"

[[section.dir]]
path = "~/.ssh/cm"
mode = "700"

[[section]]
name = "Guardrails"

# A verify-time `run` step is how you assert machine state: a non-zero exit folds into
# `boom verify`'s exit code and JSON report, and `timeout` caps a hung command.
[[section.run]]
on = "verify"
cmd = "grep -q '\\[user\\]' ~/.gitconfig || { echo 'git identity not configured'; exit 1; }"

[[section]]
name = "LaunchAgents"
# A `when` value may be a scalar or a list: a list is any-of *within* an axis, while separate
# axes still AND — this section needs a darwin machine AND one of the two profiles active.
when = { os = ["darwin"], profile = ["work", "personal"] }

# `launchd` links a plist into ~/Library/LaunchAgents and owns its launchctl lifecycle
# (load -w on sync, unload on uninstall) — no copy-pasted `launchctl unload; load -w` dance.
[[section.launchd]]
src = "launchd/com.example.agent.plist"

[[section]]
name = "lefthook"

# `run.on` accepts a list, so a step firing on more than one verb is one entry. `creates` is
# the idempotence guard: skip the step when this path already exists (repo-relative, since a
# `run` step executes from the dotfiles repo — `~` and absolute paths work too).
[[section.run]]
on = "sync"
cmd = "lefthook install"
creates = ".git/hooks/pre-commit"

[[section]]
name = "op-agent"
when = { os = "darwin" }   # a bare scalar is still valid — the one-element list

# A plain script boom puts on PATH, not a hook: `hooks/<name>.ts` is for a module that needs
# the run's context (`HookApi`); a CLI other tools exec by path is just a `link`.
[[section.link]]
src = "bin/op-agent.sh"
dst = "~/.local/bin/op-agent"

# A `run` step fires on every reconcile unless a guard says otherwise. `unless` is a *predicate*,
# not a second step: exit 0 means "already provisioned", so this one converges once and then
# goes quiet.
[[section.run]]
on = "sync"
cmd = "op-agent provision"
unless = "op-agent status >/dev/null 2>&1"

[[section.run]]
on = "verify"
cmd = "op-agent status"
